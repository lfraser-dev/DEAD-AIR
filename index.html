<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEAD AIR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root { --font: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2622; color: #fff; font-family: var(--font); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #title { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(120, 70, 30, .55), rgba(10, 8, 6, .92) 70%); }
  #title.hidden, .hidden { display: none !important; }
  #title h1 { margin: 0; font: 900 italic clamp(64px, 13vw, 150px)/0.9 var(--font); color: #ffcf3a; letter-spacing: .02em; text-shadow: 0 6px 0 #000, 0 0 40px rgba(255, 140, 20, .4); }
  #title p { margin: 10px 0 34px; font: 800 clamp(14px, 2vw, 20px) var(--font); letter-spacing: .3em; opacity: .85; }
  #title button { background: #ffcf3a; color: #111; border: 0; padding: 14px 46px; font: 900 italic 36px var(--font); letter-spacing: .04em; cursor: pointer; box-shadow: 0 5px 0 #8a6a10; }
  #title button:hover { background: #fff; }
  #title .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #title button.alt { background: rgba(255,255,255,.12); color: #fff; box-shadow: 0 5px 0 #000; font-size: 26px; }
  #title small { margin-top: 26px; font: 700 14px/1.7 var(--font); letter-spacing: .08em; opacity: .7; max-width: 560px; }
  #title a { color: #ffcf3a; }
  #err { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; font: 800 20px var(--font); background: #111; padding: 20px; text-align: center; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="title">
  <h1>DEAD AIR</h1>
  <p>OPEN WORLD · HELICOPTER · ZOMBIES · FRIENDS</p>
  <div class="row"><button id="start" type="button">PLAY ▶</button><button id="join" class="alt" type="button">JOIN A FRIEND</button></div>
  <small>Needs a keyboard and mouse.<br>W / S up and down · mouse to steer · click to shoot · right click rockets · space bombs · land to pick up, drop off and refuel<br><a href="mech.html">the old mech sketch</a></small>
</div>
<div id="err" class="hidden"></div>
<script type="module">
import { Renderer } from './src/renderer.js';
import { Sounds } from './src/audio.js';
import { HeliGame } from './src/heli/game.js';

const canvas = document.getElementById('game'), title = document.getElementById('title');
let renderer;
try { renderer = new Renderer(canvas); } catch (e) {
  const er = document.getElementById('err'); er.textContent = `Couldn't start WebGL2: ${e.message}`; er.classList.remove('hidden'); throw e;
}
const sounds = new Sounds();
const game = new HeliGame({ renderer, sounds, canvas, onExit: () => title.classList.remove('hidden'), isDev: () => false });
window.game = game;
document.getElementById('start').onclick = () => { sounds.unlock(); title.classList.add('hidden'); game.open(); };
document.getElementById('join').onclick = () => { sounds.unlock(); title.classList.add('hidden'); game.showJoin(); };

// behind the title screen: a slow fly-round of the city
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now; t += dt;
  try {
    if (game.active) game.frame(dt);
    else {
      game.load();
      game.setSky(true);
      const a = t * 0.05, eye = [Math.sin(a) * 260, 95, Math.cos(a) * 260];
      const l = Math.hypot(eye[0], 70, eye[2]), fwd = [-eye[0] / l, -70 / l, -eye[2] / l];
      game.draw(eye, fwd, 0, [], [], [0, 0, 0], 0.0045);
    }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
